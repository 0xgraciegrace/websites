    <circle cx="123.5" cy="130.5" r="3.4" fill="#F4FBFC"/>
    <path d="M85 152 L115 152 L100 169 Z" fill="#FF7A1A" stroke="#FF7A1A" stroke-width="7" stroke-linejoin="round"/>

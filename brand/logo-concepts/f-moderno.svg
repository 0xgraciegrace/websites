<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Pingüino del Oriente – concepto F, mascota moderna con sombrero y bufanda">
  <!-- feet -->
  <ellipse cx="80" cy="208" rx="19" ry="8" fill="#FF7A1A"/>
  <ellipse cx="122" cy="208" rx="19" ry="8" fill="#FF7A1A"/>
  <!-- flipper on hip -->
  <path d="M162 118 C184 136 186 166 172 180 C164 166 160 150 158 130 Z" fill="#0B1F3A"/>
  <!-- raised flipper -->
  <path d="M50 124 C32 114 18 94 18 72 C18 64 26 62 30 68 C40 84 50 100 58 112 Z" fill="#0B1F3A"/>

  <!-- head + body -->
  <path d="M100 38 C150 38 166 90 166 140 C166 190 140 206 100 206 C60 206 34 190 34 140 C34 90 50 38 100 38 Z" fill="#0B1F3A"/>
  <!-- face -->
  <path d="M100 76 C108 58 148 56 150 92 C152 122 138 136 100 136 C62 136 48 122 50 92 C52 56 92 58 100 76 Z" fill="#F4FBFC"/>
  <!-- eyes -->
  <circle cx="80" cy="93" r="13" fill="#1F5FC4"/><circle cx="120" cy="93" r="13" fill="#1F5FC4"/>
  <circle cx="81" cy="94" r="8" fill="#0B1F3A"/><circle cx="121" cy="94" r="8" fill="#0B1F3A"/>
  <circle cx="85" cy="89" r="3.8" fill="#F4FBFC"/><circle cx="125" cy="89" r="3.8" fill="#F4FBFC"/>
  <!-- open smile -->
  <path d="M84 108 Q104 146 126 106 Z" fill="#0B1F3A"/>
  <path d="M94 126 Q106 119 118 123 Q107 138 94 126 Z" fill="#F0685A"/>
  <path d="M84 108 Q104 146 126 106" fill="none" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M79 106 Q101 94 131 102 Q121 112 103 112 Q88 112 79 106 Z" fill="#FF7A1A" stroke="#FF7A1A" stroke-width="4" stroke-linejoin="round"/>
  <!-- belly -->
  <ellipse cx="104" cy="176" rx="44" ry="26" fill="#F4FBFC"/>

  <!-- scarf: blue with white stripes -->
  <path d="M44 132 Q100 158 156 132 L157 147 Q100 174 43 147 Z" fill="#1F5FC4"/>
  <path d="M47 139 Q100 164 153 139" fill="none" stroke="#F4FBFC" stroke-width="2.6"/>
  <path d="M58 142 L82 148 L80 188 L58 184 Z" fill="#1F5FC4" stroke="#1F5FC4" stroke-width="4" stroke-linejoin="round"/>
  <path d="M59 168 L80 171 M59 175 L80 178" stroke="#F4FBFC" stroke-width="2.6"/>
  <g stroke="#1F5FC4" stroke-width="3.6" stroke-linecap="round">
    <path d="M61 188 v8"/><path d="M67 189 v9"/><path d="M73 190 v8"/><path d="M79 190 v9"/>
  </g>
  <!-- sombrero de palma, worn on the head and tilted back -->
  <g transform="rotate(-10 100 50)">
    <path d="M64 50 L70 17 Q100 3 130 17 L136 50 Z" fill="#FFC933"/>
    <clipPath id="fCrown"><path d="M64 50 L70 17 Q100 3 130 17 L136 50 Z"/></clipPath>
    <rect x="60" y="37" width="80" height="11" fill="#0B1F3A" clip-path="url(#fCrown)"/>
    <path d="M84 14 Q100 10 116 14" fill="none" stroke="#E3A51A" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="100" cy="55" rx="72" ry="14" fill="#E3A51A"/>
    <ellipse cx="100" cy="51" rx="72" ry="13" fill="#FFC933"/>
    <path d="M52 50 Q100 60 148 50" fill="none" stroke="#E3A51A" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
